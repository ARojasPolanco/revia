services:
  postgres:
    image: postgres:16-alpine
    container_name: revia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revia
      POSTGRES_PASSWORD: revia
      POSTGRES_DB: revia
    ports:
      - '5433:5432'
    volumes:
      - revia_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revia -d revia']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: revia-api
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_URI: postgres://revia:revia@postgres:5432/revia
      TEST_DB_URI: postgres://revia:revia@postgres:5432/revia_test
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    container_name: revia-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  revia_pgdata:
